name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Bun's version comes from the "packageManager" field in package.json
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # web must build before api: api's tests/typecheck read apps/web/dist
      # via the assets binding, and turbo's ^build dependency only orders
      # `build` itself, not `test`/`typecheck` relative to `build`.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
